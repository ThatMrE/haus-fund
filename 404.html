<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Haus</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Mono:wght@400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#1C3B2D;color:#fff;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:80px 24px;line-height:1.6;}
a{color:inherit;text-decoration:none;}
.code{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.14em;
  text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:20px;}
h1{font-family:'Barlow Condensed',sans-serif;font-size:88px;font-weight:900;
  line-height:0.95;letter-spacing:0.03em;text-transform:uppercase;margin-bottom:20px;}
p{color:rgba(255,255,255,0.7);max-width:460px;margin:0 auto 40px;}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.btn{background:#fff;color:#1C3B2D;padding:14px 28px;border-radius:6px;
  font-size:15px;font-weight:600;transition:background 150ms;}
.btn:hover{background:#E5E1D9;}
.btn-o{border:1.5px solid rgba(255,255,255,0.3);padding:14px 24px;border-radius:6px;
  font-size:15px;color:rgba(255,255,255,0.8);transition:border-color 150ms,color 150ms;}
.btn-o:hover{border-color:rgba(255,255,255,0.7);color:#fff;}
.rule{width:120px;height:3px;background:#B8924A;margin:0 auto 28px;}
@media (max-width:680px){h1{font-size:52px;}}
</style>
</head>
<body>
  <div class="code">Error 404</div>
  <h1>Nothing<br>Here.</h1>
  <div class="rule"></div>
  <p>That page doesn’t exist — it may have moved, or the link may be wrong.</p>
  <div class="links">
    <a href="/" class="btn">Back to the House →</a>
    <a href="/sponsors" class="btn-o">Partner with us</a>
    <a href="mailto:elliot@haus.fund" class="btn-o">Email us</a>
  </div>
</body>
</html>
