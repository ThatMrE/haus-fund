name: Site checks

# Runs on every pull request and every push to main.
# Make "static" and both test jobs required checks in branch protection on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Links and public files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-site.mjs
      - run: node --test scripts/host-routing.test.mjs

  news:
    name: News app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netlify/functions/news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  homeroom:
    name: Homeroom app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netlify/functions/homeroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: netlify/functions/homeroom/package-lock.json
      - run: npm ci
      - run: npm test
