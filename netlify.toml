# Netlify Configuration for Haus Fund

[build]
  publish = "."
  command = ""

# ── LP section: HTTP Basic Auth at the edge ──
# Both paths are declared: "/lp" alone does not match the "/lp/*" pattern.
# The function fails closed if LP_PASSWORD is unset.
[[edge_functions]]
  path = "/lp"
  function = "lp-auth"

[[edge_functions]]
  path = "/lp/*"
  function = "lp-auth"

# ── tool subdomains: serve each tool at the root of its own hostname ──
# Runs on "/" only, and rewrites only for the hostnames listed in the function
# (cores.haus.fund → cores.html, visa.haus.fund → visa.html).
# _redirects cannot branch on Host, hence the edge function.
# Each hostname must also be added as a domain alias in the Netlify project.
[[edge_functions]]
  path = "/"
  function = "cores-host"

# ── News: haus.fund/news ──
# A server-rendered app, not a static page: the function claims /news and
# /news/* (declared in its own config block) and news-ingest runs the morning
# feed sweep. Assets are served from /news-assets by the CDN.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The Postgres driver ships as-is rather than through esbuild: `pg` resolves its
# optional native bindings at require time, and a bundler that inlines those
# either fails the build or produces a client that cannot connect.
[functions.homeroom]
  external_node_modules = ["pg"]

# ── Mentors: server-side Airtable proxy ──
# The token stays server-side; only whitelisted mentor fields are returned.
[[edge_functions]]
  path = "/api/mentors"
  function = "mentors"

# Redirect www to apex
[[redirects]]
  from = "https://www.haus.fund/*"
  to = "https://haus.fund/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.haus.fund"
  to = "https://haus.fund"
  status = 301
  force = true

# Cache static assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN rather than DENY: /homeroom/labs/cores embeds /cores.html,
    # which is this same origin. DENY blocks same-origin framing too.
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML should not be cached aggressively
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The feed changes as people vote; never serve it from cache.
[[headers]]
  for = "/news/*"
  [headers.values]
    Cache-Control = "no-store"

# ── Homeroom: members-only, never indexed, never cached ──
# A server-rendered app like /news: the function claims /homeroom and
# /homeroom/* in its own config block. Access is enforced in the app, not by
# these headers — a logged-out request never gets past the sign-in page.
[[headers]]
  for = "/homeroom/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store, private"

[context.production]
  environment = { CONTEXT = "production" }

[context.deploy-preview]
  environment = { CONTEXT = "deploy-preview" }

[context.branch-deploy]
  environment = { CONTEXT = "branch-deploy" }
